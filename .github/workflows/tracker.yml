name: CFB Live Score Checker

on:
  schedule:
    # Runs every 5 minutes on Saturdays between 11:00 AM and 10:00 PM US Central Time
    - cron: '*/5 16-23 * * 6'
    - cron: '*/5 0-3 * * 0'
  workflow_dispatch: # Allows manual testing anytime

jobs:
  check-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Restore Game State Cache
        uses: actions/cache@v3
        with:
          path: game_state.json
          key: game-state-${{ github.run_id }}
          restore-keys: |
            game-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Score Checker
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python cfb_notifier.py

      - name: Save Game State Cache
        uses: actions/cache@v3
        with:
          path: game_state.json
          key: game-state-${{ github.run_id }}
          
      - name: Commit and Push Updated Scores
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json game_state.json
          git commit -m "Auto-update live score JSON" || exit 0
          git push
