name: CFB Live Score Checker

on:
  schedule:
    # Runs every 5 minutes on Saturdays between 11:00 AM and 10:00 PM US Central Time
    - cron: '*/5 16-23 * * 6'
    - cron: '*/5 0-3 * * 0'
  workflow_dispatch: # Allows manual trigger testing anytime

jobs:
  check-scores:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests
m
      - name: Run Score Checker
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          PUSHCUT_API_KEY: ${{ secrets.PUSHCUT_API_KEY }}
        run: python cfb-notifier.py
